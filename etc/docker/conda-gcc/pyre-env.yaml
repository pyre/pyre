# the conda-forge build environment; {name} must not be a {.mm} project name like {pyre}
name: pyre-dev

# stick to conda-forge only
channels:
  - conda-forge

# packages
dependencies:
  # the build driver: conda-forge ships GNU make >= 4.4, which mm needs for {.WAIT}
  - make
  # interactive niceties for {.launch}
  - git
  - vim
  # the gcc toolchain: gcc and g++ for C/C++
  - gcc
  - gxx
  # the interpreter and its build-time helpers
  - python
  # pin the standard ABI, not the free-threaded build
  - python-gil
  - pybind11
  - pyyaml
  # the native external packages
  - gsl
  - hdf5
  # the postgres client library; the bindings build against it (the tests self-skip with no server)
  - libpq
  # numpy, for the gsl test suite
  - numpy
  # openmpi is skipped until {pyre.platforms} has a conda package manager

# end of file
