# mm configuration
mm:

  # resolve external dependencies straight from the active conda environment
  pkgdb: conda
  # conda installs the products into the active environment
  mode: conda
  # the staging area for the temporary build products
  bldroot: /tmp/builds
  # targets; {opt} keeps the built libraries fast enough for real work
  target: opt,shared
  # compilers; {gcc} supplies gcc/g++ for C/C++
  compilers: gcc, python/python3
  # the name of GNU make; conda-forge make satisfies the >= 4.4 requirement
  make: make

# end of file
