# mm configuration
mm:

  # resolve external dependencies straight from the installed ubuntu packages
  pkgdb: dpkg
  # build products land under {prefix}
  mode: ubuntu
  # targets; {opt} keeps the built libraries fast enough for real work
  target: opt,shared
  # compilers; {clang} supplies clang/clang++ for C/C++, the system {gfortran} for Fortran
  compilers: clang, python/python3

  # final products
  prefix: /usr/local
  # intermediate build products
  bldroot: /tmp/builds
  # the name of GNU make
  make: make

# end of file
