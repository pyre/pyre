# mm configuration
mm:

  # resolve external dependencies straight from the installed fedora packages
  pkgdb: rpm
  # targets; {opt} keeps the built libraries fast enough for real work
  target: opt,shared
  # compilers; {gcc} supplies gcc/g++ for C/C++, the system {gfortran} for Fortran
  compilers: gcc, python/python3

  # final products
  prefix: /usr/local
  # intermediate build products
  bldroot: /tmp/builds
  # the name of GNU make
  make: make

# end of file
