# an empty map, the way a dictionary renders, as text
yamlempty:
  selection: "{}"

# a whole map, in its text form, with a value that holds braces
yamltext:
  selection: "band:{{L}}"
  label: "{{L}}"

# the same map, as a yaml mapping
yamlkeys:
  selection: {band: "{{L}}"}


# end of file
