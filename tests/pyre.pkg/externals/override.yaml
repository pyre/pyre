# restrict the host to filesystem probing
pyre.host:
  packagers: [bare]

# and point the prober at the fixture installation
pyre.platforms.packagers.bare:
  searchpath: [prefix]

# pin the version of the gsl installation; discovery must not disturb this
gsl:
  version: 9.9-custom

# end of file
