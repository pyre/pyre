# restrict the host to filesystem probing
pyre.host:
  packagers: [bare]

# and point the prober at the fixture installation
pyre.platforms.packagers.bare:
  searchpath: [prefix]

# point the include path at a directory that exists but holds no headers; discovery would
# never produce this, so only the user can put an installation in this state
gsl:
  incdir: [prefix/lib]

# end of file
