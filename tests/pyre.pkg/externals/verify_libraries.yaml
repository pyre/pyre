# restrict the host to filesystem probing
pyre.host:
  packagers: [bare]

# and point the prober at the fixture installation
pyre.platforms.packagers.bare:
  searchpath: [prefix]

# add a library the installation does not provide to the link line
gsl:
  libraries: [gsl, gslcblas, nosuchlib]

# end of file
