name: pr-cmake
on:
  pull_request:
jobs:
  # build and test the ref that launched this action
  build:
    name: >-
      python-${{matrix.python}}+${{matrix.compiler}}
      ${{matrix.target}}
      on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        target: [Debug, Release]
        python: ["3.14"]
        compiler: ["gcc-15", "clang-21"]
        # define the names of the compilers
        include:
          - compiler: gcc-15
            cc: gcc-15
            cxx: g++-15
          - compiler: clang-21
            cc: clang-21
            cxx: clang++-21


    steps:
      - name: ${{matrix.os}} refresh
        run: |
          echo " -- update the package cache"
          sudo apt update
          echo " -- upgradables"
          sudo apt list --upgradable
          echo " -- upgrade"
          sudo apt dist-upgrade
          echo " -- install our dependencies"
          sudo apt install -y cmake openssh-server libgsl-dev libopenmpi-dev libhdf5-dev

      - name: python ${{matrix.python}} setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python}}

      - name: install dependencies
        run: |
          python${pythonVersion} -m pip install --upgrade pip
          pip3 install pybind11 PyYAML numpy
        env:
          pythonVersion: ${{matrix.python}}

      - name: list system packages
        run: |
          dpkg -l

      - name: versions
        run: |
          echo " -- platform tag from python"
          python${pythonVersion} -c "import sys; print(sys.platform)"
          echo " -- distribution tag from python"
          python${pythonVersion} -c "import platform; print(platform.freedesktop_os_release().get('PRETTY_NAME'))"
          echo " -- make"
          make --version
          echo " -- cmake"
          cmake --version
          echo " -- python"
          python${pythonVersion} --version
          echo "    -- prefix"
          python${pythonVersion}-config --prefix
          echo "    -- includes"
          python${pythonVersion}-config --includes
          echo "    -- libs"
          python${pythonVersion}-config --libs
          echo " -- ${{matrix.cc}}"
          ${{matrix.cc}} --version
          echo " -- ${{matrix.cxx}}"
          ${{matrix.cxx}} --version
        env:
          pythonVersion: ${{matrix.python}}

      - name: external dependencies
        run: |
          echo " -- gsl"
          sudo dpkg-query -L libgsl-dev
          echo " -- openmpi"
          sudo dpkg-query -L libopenmpi-dev
          echo " -- hdf5"
          sudo dpkg-query -L libhdf5-dev

      - name: locations of python packages
        run: |
          echo " -- numpy"
          pip3 show numpy
          echo " -- pybind11"
          pip3 show pybind11
          echo " -- its headers"
          find ${pythonLocation}/lib/python${pythonVersion}/site-packages/pybind11
          echo " -- yaml"
          pip3 show PyYAML
        env:
          pythonVersion: ${{matrix.python}}

      - name: checkout pyre
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          path: 'pyre'

      - name: build pyre
        run: |
          echo " -- switching to the build directory"
          cd ${{runner.temp}}
          mkdir build
          cd build
          echo " -- configuring the build"
          cmake -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_BUILD_TYPE=${target} -DCMAKE_C_COMPILER=${cc} -DCMAKE_CXX_COMPILER=${cxx} -DPython_ROOT_DIR=${pythonLocation} -Dpybind11_DIR=${pythonLocation}/lib/python${pythonVersion}/site-packages/pybind11/share/cmake/pybind11 -DPYRE_MPI_OVERSUBSCRIBE=ON ${{github.workspace}}/pyre
          echo " -- building pyre"
          make -j$(nproc) install
        env:
          prefix: ${{runner.temp}}/install
          target: ${{matrix.target}}
          cc: ${{matrix.cc}}
          cxx: ${{matrix.cxx}}
          pythonVersion: ${{matrix.python}}

      - name: test pyre
        run: |
          echo " -- switching to the build directory"
          cd ${{runner.temp}}/build
          echo " -- testing pyre"
          # the postgres suites, both the c++ library and the extension, need a running server,
          # which this runner does not have
          ctest -E postgres

      - name: consume the installed package
        run: |
          echo " -- switching to the consumer build directory"
          cd ${{runner.temp}}
          mkdir consumer
          cd consumer
          # nothing here locates hdf5 or selects a language standard; the package configuration
          # in the prefix has to do both, which is what this step is checking
          echo " -- configuring a downstream project against the installed prefix"
          cmake -DCMAKE_PREFIX_PATH=${prefix} -DCMAKE_CXX_COMPILER=${cxx} -DPYRE_CONSUMER_EXPECT_HDF5=ON ${{github.workspace}}/pyre/etc/cmake/consumer
          echo " -- building it"
          make -j$(nproc)
          echo " -- running it"
          ctest --output-on-failure
        env:
          prefix: ${{runner.temp}}/install
          cxx: ${{matrix.cxx}}

  # build without hdf5 and confirm the package configuration does not ask consumers for it; this
  # is the only way to catch a configuration that demands more than the installation actually uses
  minimal:
    name: without hdf5 on ubuntu-26.04
    runs-on: ubuntu-26.04
    env:
      pythonVersion: "3.14"
      prefix: ${{github.workspace}}/install

    steps:
      - name: ubuntu-26.04 refresh
        run: |
          echo " -- update the package cache"
          sudo apt update
          echo " -- install our dependencies"
          # hdf5 stays installed on purpose: we disable the search rather than remove the
          # package, so that what drops the dependency is demonstrably the configuration
          sudo apt install -y cmake openssh-server libgsl-dev libopenmpi-dev libhdf5-dev

      - name: python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: install dependencies
        run: |
          python${pythonVersion} -m pip install --upgrade pip
          pip3 install pybind11 PyYAML numpy

      - name: checkout pyre
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          path: 'pyre'

      - name: build pyre without hdf5
        run: |
          echo " -- switching to the build directory"
          cd ${{runner.temp}}
          mkdir build
          cd build
          echo " -- configuring the build with the hdf5 search disabled"
          cmake -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15 -DPython_ROOT_DIR=${pythonLocation} -Dpybind11_DIR=${pythonLocation}/lib/python${pythonVersion}/site-packages/pybind11/share/cmake/pybind11 -DCMAKE_DISABLE_FIND_PACKAGE_HDF5=ON -DPYRE_BUILD_TESTING=OFF ${{github.workspace}}/pyre
          echo " -- building pyre"
          make -j$(nproc) install

      - name: consume the installed package
        run: |
          echo " -- switching to the consumer build directory"
          cd ${{runner.temp}}
          mkdir consumer
          cd consumer
          echo " -- configuring a downstream project against the installed prefix"
          cmake -DCMAKE_PREFIX_PATH=${prefix} -DCMAKE_CXX_COMPILER=g++-15 -DPYRE_CONSUMER_EXPECT_HDF5=OFF ${{github.workspace}}/pyre/etc/cmake/consumer
          echo " -- building it"
          make -j$(nproc)
          echo " -- running it"
          ctest --output-on-failure

# end of file
