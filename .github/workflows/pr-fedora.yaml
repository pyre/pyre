name: pr-fedora
on:
  pull_request:

# a new push to a pull request replaces the runs of the commits it supersedes, so they stop
# holding runners; runs for any other event are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # build and test the ref that launched this action on the current fedora release, with
  # every external dependency discovered through the rpm package database; unlike the
  # ubuntu legs, there is no hand written package configuration anywhere in this workflow
  build:
    name: >-
      ${{matrix.target}} gcc on fedora:latest
    runs-on: ${{matrix.os}}
    container:
      image: fedora:latest
      # openmpi's shared memory transport needs more than docker's default 64M {/dev/shm}
      options: --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        target: [opt]

    # the container runs as root, which the postgres server refuses; the build and its tests run as
    # a user of their own, as they do on a workstation
    steps:
      - name: fedora refresh
        run: |
          echo " -- upgrade"
          dnf -y upgrade
          echo " -- install our dependencies"
          dnf -y install \
              git make findutils which procps-ng hostname diffutils zip unzip \
              openssh-server passwd util-linux \
              gcc gcc-c++ gcc-gfortran \
              python3-devel python3-pyyaml python3-ruamel-yaml python3-numpy pybind11-devel \
              gsl-devel hdf5-devel openmpi-devel libpq-devel postgresql-server

      - name: the user that builds and tests
        run: |
          echo " -- making the user"
          useradd --create-home builder

      - name: passwordless ssh to localhost
        run: |
          echo " -- generating the host keys"
          ssh-keygen -A
          echo " -- generating the key of the user"
          mkdir -p -m 700 /home/builder/.ssh
          ssh-keygen -q -t ed25519 -N "" -f /home/builder/.ssh/id_ed25519
          cp /home/builder/.ssh/id_ed25519.pub /home/builder/.ssh/authorized_keys
          chmod 600 /home/builder/.ssh/authorized_keys
          printf 'Host localhost\n    StrictHostKeyChecking no\n    UserKnownHostsFile /dev/null\n    LogLevel ERROR\n' > /home/builder/.ssh/config
          chmod 600 /home/builder/.ssh/config
          echo " -- handing the keys to the user"
          chown -R builder:builder /home/builder/.ssh
          echo " -- starting the server"
          /usr/sbin/sshd

      - name: openmpi on the path
        run: |
          echo " -- fedora activates mpi through environment modules; bypass them"
          echo "/usr/lib64/openmpi/bin" >> ${GITHUB_PATH}

      - name: versions
        run: |
          echo " -- distribution"
          cat /etc/os-release | head -2
          echo " -- make"
          make --version
          echo " -- python"
          python3 --version
          echo " -- gcc"
          gcc --version
          echo " -- g++"
          g++ --version

      - name: external dependencies
        run: |
          echo " -- gsl"
          rpm -ql gsl-devel | head -5
          echo " -- openmpi"
          rpm -ql openmpi-devel | head -5
          echo " -- hdf5"
          rpm -ql hdf5-devel | head -5

      - name: clone mm
        run: |
          echo " -- cloning mm"
          git clone https://github.com/aivazis/mm

      - name: checkout pyre
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: 'pyre'

      - name: hand the checkouts to the user
        run: |
          echo " -- the user builds in them"
          chown -R builder:builder mm pyre

      - name: mm diagnostics
        run: |
          echo " -- switching to the pyre home directory"
          cd pyre
          echo " -- interrogating the package database"
          ${mm} --setup
          echo " -- checking whether mm can run from here"
          ${mm} host.info
          ${mm} builder.info
          echo " -- the externals, as discovered"
          ${mm} extern.info
          echo " -- the individual packages"
          ${mm} extern.gsl.info
          ${mm} extern.mpi.info
          ${mm} extern.hdf5.info
          ${mm} extern.pybind11.info
          ${mm} extern.python.info
        env:
          mm: runuser -u builder -- python3 ../mm/mm --config=.github/matrix/fedora.pfg
          target: ${{matrix.target}}

      - name: build pyre
        run: |
          echo " -- switching to the pyre home directory"
          cd pyre
          echo " -- building pyre"
          ${mm} --jobs=2
        env:
          mm: runuser -u builder -- python3 ../mm/mm --config=.github/matrix/fedora.pfg
          target: ${{matrix.target}}

      - name: test pyre
        run: |
          echo " -- switching to the pyre home directory"
          cd pyre
          echo " -- testing pyre"
          ${mm} --jobs=2 tests
        env:
          mm: runuser -u builder -- python3 ../mm/mm --config=.github/matrix/fedora.pfg
          target: ${{matrix.target}}
