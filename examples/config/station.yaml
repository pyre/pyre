# the weather station; the comments in this file survive every trip through the driver
station:
    # where it is
    label: "mount wilson" # quoted on purpose
    elevation: 1742*m
    # how often it reports
    cadence: 15

# its sensor, configured in place
station.sensor:
    gain: 2.5

# end of file
