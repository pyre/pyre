# build time
[build-system]
requires = [
    "wheel",
    "setuptools",
    "setuptools_scm[toml]",
    "cmake",
    "scikit-build",
    "pybind11",
    "numpy",
    "ninja; platform_system!='Windows'",
]
build-backend = "setuptools.build_meta"

# install time
[project]
name = "pyre"
dynamic = ["version"]
description = "A framework for building scientific applications"
readme = "README.md"
authors = [
    { name = "Michael A.G. Aïvázis", email = "michael.aivazis@para-sim.com" },
]
maintainers = [
    { name = "Michael A.G. Aïvázis", email = "michael.aivazis@para-sim.com" },
]
# the floor: the oldest interpreter the test suite is known to pass under; CI exercises it and
# everything newer (see .github/workflows/mm.yaml)
requires-python = ">=3.11"
keywords = ["science", "framework"]
classifiers = [
    "Development Status :: 6 - Mature",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["PyYAML"]

# optional: the round trip editor of yaml documents rides on ruamel.yaml
[project.optional-dependencies]
editing = ["ruamel.yaml"]

# formatting: wrap at column 100
[tool.black]
line-length = 100

# versioning: derive the version from the most recent git tag; an untagged commit yields
# {X.Y.Z.devN} without the local {+gHASH} suffix, which the package indices refuse, so a dry
# run from a branch can be uploaded to TestPyPI
[tool.setuptools_scm]
local_scheme = "no-local-version"

# package discovery
[tool.setuptools.packages.find]
where = ["packages"]
include = ["journal*"]
# include = ["cuda", "gsl", "journal", "merlin", "mpi", "pyre"]
namespaces = false

# end of file
