# build time
[build-system]
requires = [
    "wheel",
    "setuptools",
    "setuptools_scm[toml]",
    "cmake",
    "scikit-build",
    "pybind11",
    "numpy",
    "ninja; platform_system!='Windows'",
]
build-backend = "setuptools.build_meta"

# install time
[project]
name = "pyre"
dynamic = ["version"]
description = "A framework for building scientific applications"
readme = "README.md"
authors = [
    { name = "Michael A.G. Aïvázis", email = "michael.aivazis@para-sim.com" },
]
maintainers = [
    { name = "Michael A.G. Aïvázis", email = "michael.aivazis@para-sim.com" },
]
# the floor: the oldest interpreter the test suite is known to pass under; CI exercises it and
# everything newer (see .github/workflows/mm.yaml)
requires-python = ">=3.11"
keywords = ["science", "framework"]
classifiers = [
    "Development Status :: 6 - Mature",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["PyYAML"]

# optional: the round trip editor of yaml documents rides on ruamel.yaml
[project.optional-dependencies]
editing = ["ruamel.yaml"]

# formatting: wrap at column 100
[tool.black]
line-length = 100
# the versions of python the code is formatted for; without an explicit list, black infers
# one from {requires-python} that reaches past the interpreter it runs under
target-version = ["py311", "py312", "py313", "py314"]
# the sources black leaves alone, even when they are named on the command line: project
# templates hold substitution markers that are not python until they are expanded, and one
# test fixture is a syntax error on purpose
force-exclude = "^/(templates/.*|tests/pyre\\.pkg/framework/sample_syntaxerror\\.py)$"

# spell checking of the prose in comments, docstrings, and documentation; the exclusions are
# checked in and reviewed like any other change: {ignore-words} lists real words that
# codespell mistakes for misspellings, {exclude-file} lists exact lines that are right as they
# are, and {ignore-regex} leaves out mixed case identifiers such as {copyIn} or {cellsT},
# which are code rather than prose
[tool.codespell]
skip = "*.graffle,*.nb,*.png,*.jpg,*.gif,*.ico,*.pdf,*.svg,*.woff,*.woff2,*.ttf,tests/pyre.pkg/externals/*,./tests/pyre.pkg/externals/*"
ignore-words = "etc/ci/conventions/codespell-words.txt"
exclude-file = "etc/ci/conventions/codespell-lines.txt"
ignore-regex = "\\b[a-z]+[A-Z][A-Za-z0-9]*\\b"

# versioning: derive the version from the most recent git tag; an untagged commit yields
# {X.Y.Z.devN} without the local {+gHASH} suffix, which the package indices refuse, so a dry
# run from a branch can be uploaded to TestPyPI
[tool.setuptools_scm]
local_scheme = "no-local-version"

# package discovery
# every package cmake installs is declared here, so that scikit-build places them at the root
# of the wheel and merges the extension modules cmake builds into them; a package that is not
# declared lands in the wheel's data tree instead, where the repair tools that bundle the
# shared libraries miscompute the paths from the extensions to the libraries
[tool.setuptools.packages.find]
where = ["packages"]
include = ["pyre*", "journal*", "merlin*", "mpi*", "gsl*", "survey*", "cuda*"]
namespaces = false

# end of file
